[project]
name = "financial-skill-factory"
version = "0.1.0"
description = "Real-case-driven production line for finance agent tasks (materials, GT, rubric, verification)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fsf = "fsf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["fsf"]

[tool.setuptools.package-data]
fsf = ["templates/*"]
