name: Financial Skill Factory V2

on:
  push:
    branches:
      - v2
      - integration/expert-task-pipeline-v2
  pull_request:
    branches:
      - v2
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Validate financial registries
        run: |
          python -m json.tool finance/skill_registry.json > /dev/null
          python -m json.tool finance/domain_catalog.json > /dev/null
          python -m json.tool finance/batch/selected_tasks.json > /dev/null
      - name: Run full V2 test suite
        run: make v2-test
      - name: Run batch integration tests
        run: make batch-test
      - name: Build scaffold packages and verify CRC
        run: make batch-scaffold
